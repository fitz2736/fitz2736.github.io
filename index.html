  <h1>Hermes Kayla</h1>

  <p>
    Hermes Kayla 是私人使用的 Discord 助理機器人，
    用於依照授權使用者的明確指令，查詢及整理 Google 日曆、
    Gmail、Google Drive、Google 文件、Google 試算表與 Google 聯絡人資料。
  </p>

  <p>
    應用程式只會在使用者提出要求時存取已授權的 Google 資料，
    並將必要內容用於完成查詢、摘要、提醒及行程整理等功能。
  </p>

  <p>
    Hermes Kayla 不會出售 Google 使用者資料，
    也不會將 Google 使用者資料用於廣告或訓練通用人工智慧模型。
  </p>
